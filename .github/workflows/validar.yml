name: Validar entrega

# Roda em todo Pull Request e comenta o resultado.
# O aluno pode corrigir e dar push no mesmo branch — o workflow roda de novo.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Barreira de segurança: segredos NUNCA podem entrar no repo ──────
      - name: Bloquear segredos commitados
        id: segredos
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          PROIBIDOS=$(git diff --name-only "$BASE"...HEAD | grep -E \
            '(google-services\.json|GoogleService-Info\.plist|\.jks$|\.keystore$|key\.properties$|^\.env$|/\.env$)' || true)
          if [ -n "$PROIBIDOS" ]; then
            echo "achados<<EOF" >> "$GITHUB_OUTPUT"
            echo "$PROIBIDOS"   >> "$GITHUB_OUTPUT"
            echo "EOF"          >> "$GITHUB_OUTPUT"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Descobrir pastas alteradas
        id: alvo
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          PASTAS=$(git diff --name-only "$BASE"...HEAD \
                    | grep -oE '^(exercicios/aula[0-9]{2}|projeto)' \
                    | sort -u | tr '\n' ' ')
          echo "pastas=$PASTAS" >> "$GITHUB_OUTPUT"
          [ -z "$PASTAS" ] && echo "vazio=true" >> "$GITHUB_OUTPUT" \
                           || echo "vazio=false" >> "$GITHUB_OUTPUT"
          echo "Pastas alteradas: ${PASTAS:-nenhuma}"

      - name: Verificar título do PR
        id: titulo
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          if echo "$TITULO" | grep -qE '^\[(Aula [0-9]{2}|Checkpoint M[1-7])\] .+'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar RESPOSTAS.md
        id: respostas
        if: steps.alvo.outputs.vazio == 'false'
        run: |
          FALTANDO=""
          for P in ${{ steps.alvo.outputs.pastas }}; do
            case "$P" in
              exercicios/aula*) [ -f "$P/RESPOSTAS.md" ] || FALTANDO="$FALTANDO $P" ;;
            esac
          done
          echo "faltando=$FALTANDO" >> "$GITHUB_OUTPUT"
          [ -z "$FALTANDO" ] && echo "ok=true" >> "$GITHUB_OUTPUT" \
                             || echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: Instalar Flutter
        if: steps.alvo.outputs.vazio == 'false' && steps.segredos.outputs.ok == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true

      - name: Analisar e testar cada projeto Flutter alterado
        id: flutter
        if: steps.alvo.outputs.vazio == 'false' && steps.segredos.outputs.ok == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          FALHOU=0
          ENCONTROU=0
          for P in ${{ steps.alvo.outputs.pastas }}; do
            # cada pubspec.yaml dentro da pasta é um projeto Flutter
            while IFS= read -r PUBSPEC; do
              DIR=$(dirname "$PUBSPEC")
              ENCONTROU=1
              echo "::group::$DIR"
              (
                cd "$DIR"
                flutter pub get              2>&1 | tail -20
                echo "--- flutter analyze ---"
                flutter analyze --no-pub     2>&1 | tail -60 || exit 1
                echo "--- flutter test ---"
                if [ -d test ]; then
                  flutter test --no-pub      2>&1 | tail -60 || exit 1
                else
                  echo "(sem pasta test/ — pulando)"
                fi
              ) || FALHOU=1
              echo "::endgroup::"
            done < <(find "$P" -name pubspec.yaml -not -path '*/.dart_tool/*')
          done
          echo "encontrou=$ENCONTROU" >> "$GITHUB_OUTPUT"
          exit $FALHOU
        # a saída completa fica nos logs do job; o comentário resume

      - name: Comentar no PR
        if: always()
        uses: actions/github-script@v7
        env:
          VAZIO:       ${{ steps.alvo.outputs.vazio }}
          PASTAS:      ${{ steps.alvo.outputs.pastas }}
          TITULO_OK:   ${{ steps.titulo.outputs.ok }}
          RESP_OK:     ${{ steps.respostas.outputs.ok }}
          RESP_FALT:   ${{ steps.respostas.outputs.faltando }}
          SEGREDOS_OK: ${{ steps.segredos.outputs.ok }}
          SEGREDOS:    ${{ steps.segredos.outputs.achados }}
          FLUTTER:     ${{ steps.flutter.outcome }}
          ENCONTROU:   ${{ steps.flutter.outputs.encontrou }}
          RUN_URL:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const e = process.env;
            const L = [];
            L.push('## 🤖 Validação automática');
            L.push('');

            if (e.SEGREDOS_OK === 'false') {
              L.push('## 🔴 SEGREDO COMMITADO — entrega bloqueada');
              L.push('');
              L.push('Os arquivos abaixo **nunca** podem entrar no repositório:');
              L.push('');
              L.push('```');
              L.push(e.SEGREDOS.trim());
              L.push('```');
              L.push('');
              L.push('**Como corrigir:**');
              L.push('1. Adicione o arquivo ao `.gitignore`');
              L.push('2. `git rm --cached <arquivo>`');
              L.push('3. Commit e push novamente');
              L.push('');
              L.push('> ⚠️ Se a chave é real, **revogue-a**: o histórico do Git guarda o conteúdo mesmo após a remoção.');
            } else if (e.VAZIO === 'true') {
              L.push('⚠️ **Nenhuma pasta de exercício foi alterada neste PR.**');
              L.push('');
              L.push('Verifique se você editou arquivos dentro de `exercicios/aulaNN/`.');
            } else {
              L.push(`**Pastas avaliadas:** \`${e.PASTAS.trim()}\``);
              L.push('');
              L.push('| Verificação | Resultado |');
              L.push('|---|---|');
              L.push(`| Segredos | ✅ nenhum |`);
              L.push(`| Título do PR | ${e.TITULO_OK === 'true' ? '✅ ok' : '⚠️ fora do padrão `[Aula NN] Seu Nome`'} |`);
              L.push(`| \`RESPOSTAS.md\` | ${e.RESP_OK === 'true' ? '✅ presente' : '❌ faltando em `' + (e.RESP_FALT || '').trim() + '`'} |`);
              if (e.ENCONTROU === '1') {
                L.push(`| \`flutter analyze\` + \`flutter test\` | ${e.FLUTTER === 'success' ? '✅ passou' : '❌ falhou'} |`);
              } else {
                L.push(`| Projeto Flutter | ℹ️ nenhum \`pubspec.yaml\` encontrado (lista sem código?) |`);
              }
              L.push('');
              L.push(`[📋 Ver log completo da execução](${e.RUN_URL})`);
              L.push('');
              if (e.FLUTTER !== 'success' && e.ENCONTROU === '1') {
                L.push('> Corrija e dê **push no mesmo branch** — a validação roda novamente.');
              } else {
                L.push('> Tudo verde. A correção manual (rubrica) vem em seguida.');
              }
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: L.join('\n'),
            });

      - name: Falhar o job se houver segredo ou teste quebrado
        if: |
          steps.segredos.outputs.ok == 'false' ||
          (steps.alvo.outputs.vazio == 'false' && steps.flutter.outcome != 'success')
        run: exit 1
